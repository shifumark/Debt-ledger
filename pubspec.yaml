name: debt_ledger
description: "Debt Ledger — private offline-first debt tracking for a single creditor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.7.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  cryptography: ^2.7.0

  # Models / codegen-consumed
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utility
  collection: ^1.19.1
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.70.2

  # Images
  image_picker: ^1.1.2

  # Formatting
  intl: ^0.19.0

  # Functional error handling
  fpdart: ^1.1.1

  # Non-sensitive preferences (theme mode, sort/filter defaults)
  shared_preferences: ^2.3.5

  # Reports export
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  csv: ^6.0.0
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
